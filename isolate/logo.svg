<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nexora">
  <defs>
    <linearGradient id="nxMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="nxTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151321"/>
      <stop offset="100%" stop-color="#0A0A12"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="16" y="16" width="480" height="480" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded dark tile -->
  <g clip-path="url(#tileClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#nxTile)"/>
    <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" ry="110.5" fill="none" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="3"/>
  </g>

  <!-- N monogram: left stem, diagonal, right stem (rounded caps) -->
  <g stroke="url(#nxMark)" fill="none">
    <!-- left vertical stem -->
    <line x1="146" y1="352" x2="146" y2="168" stroke-width="56" stroke-linecap="round"/>
    <!-- diagonal -->
    <line x1="146" y1="168" x2="366" y2="352" stroke-width="56" stroke-linecap="round"/>
    <!-- right vertical stem -->
    <line x1="366" y1="168" x2="366" y2="352" stroke-width="56" stroke-linecap="round"/>
  </g>

  <!-- White node dots -->
  <circle cx="146" cy="168" r="24" fill="#FFFFFF"/>
  <circle cx="366" cy="352" r="24" fill="#FFFFFF"/>
  <circle cx="256" cy="258" r="12" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
