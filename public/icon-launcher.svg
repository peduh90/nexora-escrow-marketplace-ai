<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nexora">
  <defs>
    <linearGradient id="nxL" gradientUnits="userSpaceOnUse" x1="110" y1="120" x2="410" y2="390">
      <stop offset="0%" stop-color="#5590FA"/>
      <stop offset="50%" stop-color="#7B6FF5"/>
      <stop offset="100%" stop-color="#B76CFB"/>
    </linearGradient>
    <linearGradient id="nxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1832"/>
      <stop offset="100%" stop-color="#0C0B18"/>
    </linearGradient>
    <radialGradient id="nxGlow" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed brand background. No border, no dots: launcher icons must
       survive circular masks and 48dp sizes — one bold glyph only. -->
  <rect width="512" height="512" fill="url(#nxBg)"/>
  <rect width="512" height="512" fill="url(#nxGlow)"/>

  <!-- Bold N monogram, fills the maskable safe zone, no decorations -->
  <g stroke="url(#nxL)" fill="none" stroke-linecap="round" stroke-width="76">
    <line x1="150" y1="372" x2="150" y2="140"/>
    <line x1="150" y1="140" x2="362" y2="372"/>
    <line x1="362" y1="140" x2="362" y2="372"/>
  </g>
</svg>
